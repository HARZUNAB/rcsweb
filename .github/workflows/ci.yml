name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Entorno
        run: |
          python -V
          pip --version
          pytest --version
          pip freeze

      - name: Lint
        run: ruff check .

      - name: Tests
        run: |
          set +e
          pytest -q --maxfail=1 2>&1 | tee /tmp/pytest.log
          estado=${PIPESTATUS[0]}
          if [ "$estado" -ne 0 ]; then
            echo "::error::pytest terminó con código $estado"
            tail -40 /tmp/pytest.log | while IFS= read -r linea; do
              echo "::error::$linea"
            done
          fi
          exit "$estado"
