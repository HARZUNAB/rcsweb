[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcsweb"
version = "0.7.0"
description = "Revisor de Catálogos Sísmicos — plataforma web"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web
    "Flask>=3.0,<4",
    "Flask-SQLAlchemy>=3.1,<4",
    "Flask-Migrate>=4.0,<5",
    "Flask-Login>=0.6.3,<0.7",
    "Flask-WTF>=1.2,<2",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    # Tareas
    "celery[redis]>=5.4,<6",
    "redis>=5.0,<7",
    # Servidor
    "gunicorn>=23,<24",
    "python-dotenv>=1.0,<2",
    # Núcleo del pipeline (se valida en el spike de dependencias)
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "matplotlib>=3.8,<4",
    "scipy>=1.11,<2",
    "cartopy>=0.22,<0.25",
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
    "pyshp>=2.3,<3",
    "adjustText>=1.2,<2",
    "Levenshtein>=0.23",
    "rapidfuzz>=3.4",
    "thefuzz>=0.20",
    "requests>=2.31,<3",
    "psycopg2-binary>=2.9",
    "pytz>=2024.1",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "tasks*"]

[tool.setuptools.package-data]
app = ["templates/**/*", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tasks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: usa el proyecto base montado y corre el pipeline real",
]
